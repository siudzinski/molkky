name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Every build of the Web project (tests and publish included) generates its Tailwind CSS
      # with the CLI from node_modules
      - name: Install npm packages
        run: npm ci

      - name: Restore
        run: dotnet restore molkky.slnx

      # Warnings are errors (Directory.Build.props)
      - name: Build
        run: dotnet build molkky.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution molkky.slnx -c Release --no-build

      - name: Format
        run: dotnet format molkky.slnx --verify-no-changes --no-restore

      # Same publish as the deploy workflow, so a broken GitHub Pages build fails the PR
      - name: Publish
        run: dotnet publish src/Molkky.Web/Molkky.Web.csproj -c Release -o publish -p:GHPages=true

      - name: Check GitHub Pages output
        run: |
          grep -q '<base href="/molkky/" />' publish/wwwroot/index.html
          test -f publish/wwwroot/404.html
          # A processed index.html: fingerprints filled in and the Brotli loader added
          if grep -q '#\[\.{fingerprint}\]' publish/wwwroot/index.html; then echo "index.html was not processed"; exit 1; fi
          grep -q 'brotliloader.min.js' publish/wwwroot/index.html
          # PWA: the offline service worker (not the development one), its asset list with the .br files, the manifest
          grep -q 'molkky-offline-' publish/wwwroot/service-worker.js
          grep -q '\.wasm\.br"' publish/wwwroot/service-worker-assets.js
          test -f publish/wwwroot/manifest.webmanifest
