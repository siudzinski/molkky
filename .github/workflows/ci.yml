name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Same publish as the deploy workflow, so a broken GitHub Pages build fails the PR
      - name: Publish
        run: dotnet publish src/Molkky.Web/Molkky.Web.csproj -c Release -o publish -p:GHPages=true
